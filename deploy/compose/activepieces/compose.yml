name: techflow-activepieces

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: "${POSTGRES_IMAGE_REF:-pgvector/pgvector:0.8.0-pg14@sha256:c55d7e7deac05dde62139e0ded4fcf4f58363656cbc382dbea82fbed995aa767}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE:?AP_POSTGRES_DATABASE is required}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME:?AP_POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?AP_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  redis:
    image: "${REDIS_IMAGE_REF:-redis:7.0.7@sha256:bb474c35022ca2c5618f4c49ca759bd2c0eea1daf5d934c560bd30092b97b498}"
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${AP_REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${AP_REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  app:
    image: "${AP_IMAGE_REF:-ghcr.io/activepieces/activepieces:0.86.3@sha256:208517c4f0d798a477a0c594bf432dd0f4918433f4b6f5b5f188a6e10e638c6c}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AP_CONTAINER_TYPE: APP
    volumes:
      - activepieces_cache:/usr/src/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:80/api/v1/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      frontend:
      backend:
      automation_egress:
        ipv4_address: 172.30.19.9
        aliases:
          - activepieces-control

  event-gateway:
    image: "${TECHFLOW_GATEWAY_IMAGE:-ablestack-techflow/event-gateway:0.2.0}"
    build:
      context: ./event-gateway
      args:
        TECHFLOW_GATEWAY_VERSION: "${TECHFLOW_GATEWAY_VERSION:-0.2.0}"
        SOURCE_DATE_EPOCH: "0"
      provenance: false
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8081/healthz', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      frontend:
      backend:
      automation_egress:
        ipv4_address: 172.30.19.10
        aliases:
          - chat-adapter

  ingress:
    image: "${CADDY_IMAGE_REF:-caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17}"
    restart: unless-stopped
    ports:
      - ${AP_BIND_ADDRESS:-172.16.0.231}:${AP_HTTP_PORT:-8080}:8080
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      event-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://localhost:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0750
      - /data:size=16m,mode=0750
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - frontend

  worker:
    image: "${AP_IMAGE_REF:-ghcr.io/activepieces/activepieces:0.86.3@sha256:208517c4f0d798a477a0c594bf432dd0f4918433f4b6f5b5f188a6e10e638c6c}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces-control:80
      AP_WORKER_CONCURRENCY: "1"
    volumes:
      - activepieces_cache:/usr/src/app/cache
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:80/api/v1/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend
      - automation_egress

volumes:
  activepieces_cache:
  postgres_data:
  redis_data:

networks:
  frontend:
  backend:
  automation_egress:
    ipam:
      config:
        - subnet: 172.30.19.0/28
